apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polenta-sardine-deploy-prod
  namespace: polenta
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=ghcr.io/marcobacis/polenta-sardine-deploy
    argocd-image-updater.argoproj.io/app.update-strategy: latest
    argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag

spec:
  project: default
  source:
    repoURL: https://github.com/marcobacis/polenta_sardine_deploy.git
    path: charts/polenta-sardine-deploy-chart
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: polenta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true